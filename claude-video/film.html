<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Vídeos com Claude · Versão clara</title>
<!--
  Motion explicativo "Como editar vídeos com Claude" · versão clara · 1080×1920 (9:16) · 30 fps.

  Roteiro: Motion_PTBR_Roteiro_Prompts_v01.md · Storyboard: Storyboard_Claude_Claro_v01_APROVACAO.pdf.
  Grade do storyboard (Reels): área útil x 90–910 / y 300–1240, coluna centrada em x = 500,
  legenda em y 1058–1144, logo Jackdsgn claro em x 108 / y 1184 / 150 px.

  O quadro é função pura do tempo: window.seek(t). Sem CSS transitions, timers,
  relógio do navegador ou valores aleatórios. Abra com ?t=4.6 para um quadro, ?play para tocar.

  Cenas montadas nesta versão: 01 a 04 (0–10 s). Prévia de aprovação: 0–8 s, sem áudio.
-->
<style>
@font-face{font-family:"Instrument Serif";font-style:normal;font-weight:400;src:url("assets/InstrumentSerif-Regular.woff2") format("woff2")}
@font-face{font-family:"Instrument Serif";font-style:italic;font-weight:400;src:url("assets/InstrumentSerif-Italic.woff2") format("woff2")}
@font-face{font-family:"Inter";font-style:normal;font-weight:100 900;src:url("assets/Inter-var.woff2") format("woff2")}
@font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:400;src:url("assets/JetBrainsMono-Regular.woff2") format("woff2")}

:root{
  --bg:#F7F4ED; --ink:#24231F; --accent:#D77A5C; --line:#DAD7CC; --card:#FFFFFF;
  --muted:#8C887E; --soft:#F2EEE7;
  --serif:"Instrument Serif",serif; --sans:"Inter",sans-serif; --mono:"JetBrains Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
#stage{position:absolute;inset:0;overflow:hidden;
  background:
    radial-gradient(ellipse 620px 520px at 230px 900px, rgba(226,170,146,.16), transparent 70%),
    radial-gradient(ellipse 700px 600px at 780px 420px, rgba(255,255,255,.55), transparent 70%),
    var(--bg)}
.abs{position:absolute;left:0;top:0;transform-origin:50% 50%}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.02em}
.it{font-style:italic;color:var(--accent)}

/* Cena 01 */
.eyebrow{width:820px;left:90px;text-align:center;font-weight:700;font-size:26px;letter-spacing:.11em;color:var(--accent)}
.s1line{width:820px;left:90px;text-align:center;font-size:164px;line-height:1}
.clip{position:absolute;top:0;height:42px;width:185px;border-radius:9px;background:#E0876A}
#playhead{position:absolute;top:-14px;width:3px;height:72px;margin-left:-1.5px;border-radius:2px;background:var(--ink)}

/* Cena 02 */
#s2a{width:820px;left:90px;text-align:center;font-size:164px;line-height:1}
#s2n{width:820px;left:90px;text-align:center;font-size:470px;line-height:1;color:var(--accent);-webkit-text-stroke:7px var(--accent);transform-origin:50% 62%}
#s2p{width:820px;left:90px;text-align:center;font-size:80px;font-weight:500;letter-spacing:-.01em}

/* Cabeçalho dos passos */
.seg{position:absolute;top:0;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.seg i{position:absolute;inset:0;background:var(--accent);transform-origin:0 50%;transform:scaleX(0)}
.slabel{font-weight:600;font-size:22px;color:var(--accent);white-space:nowrap}
.stitle{font-size:94px;line-height:1;white-space:nowrap}

/* Chat (componente reutilizado nas cenas 03, 07, 08 e 10) */
.chat{width:560px;height:400px;background:var(--card);border-radius:24px;
  box-shadow:0 1px 2px rgba(36,35,31,.05),0 14px 26px rgba(36,35,31,.08);border:1px solid #EEEBE4;overflow:hidden}
.chat .bar{position:absolute;left:0;top:0;right:0;height:44px;border-bottom:1px solid #EFECE6}
.chat .dot{position:absolute;top:16px;width:12px;height:12px;border-radius:50%}
.chat .name{position:absolute;left:0;right:0;top:0;line-height:44px;text-align:center;font-size:16px;font-weight:500;color:#5E5B54}
.chat .hello{position:absolute;left:0;right:0;top:152px;text-align:center;font-size:28px;font-weight:650;letter-spacing:-.01em}
.chat .input{position:absolute;left:16px;right:16px;bottom:18px;height:66px;border-radius:15px;background:#F7F5F0;border:1px solid #ECE8E0}
.chat .ph{position:absolute;left:19px;top:0;line-height:64px;font-size:18px;color:#8C887E}
.chat .send{position:absolute;right:14px;top:15px;width:34px;height:34px;border-radius:9px;background:#E7E3DA}
.note{width:560px;text-align:center;font-size:19px;color:#8C887E}

/* Cena 04 */
.guide{width:232px;height:416px;background:var(--card);border-radius:16px;overflow:hidden;
  box-shadow:0 1px 2px rgba(36,35,31,.05),0 14px 26px rgba(36,35,31,.08)}
.guide .head{position:absolute;left:0;right:0;top:0;height:68px;background:var(--accent)}
.guide .head span{position:absolute;left:25px;top:0;line-height:70px;color:#fff;font-weight:800;font-size:23px;letter-spacing:.005em}
.item{position:absolute;left:25px;height:34px;width:200px}
.item .ck{position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;background:#F2EEE8}
.item .ck svg{position:absolute;left:8px;top:9px}
.item span{position:absolute;left:58px;top:0;line-height:34px;font-size:19px;font-weight:500}
.ref{width:184px;height:226px;background:var(--card);border-radius:14px;
  box-shadow:0 1px 2px rgba(36,35,31,.05),0 12px 24px rgba(36,35,31,.09)}
.ref b{position:absolute;left:18px;top:14px;font-weight:600;font-size:14px;font-style:italic}
.ref svg{position:absolute;left:14px;top:44px;border-radius:6px}

/* Legenda e logo */
#cap{left:90px;top:1058px;width:820px;height:44px;display:flex;align-items:center;justify-content:center}
#cap div{position:absolute;width:820px;text-align:center;font-weight:650;font-size:34px;letter-spacing:-.005em;white-space:nowrap}
#cap em{font-style:normal}
#logo{left:108px;top:1184px;width:150px;height:39px}
</style>
</head>
<body>
<div id="stage">

  <!-- 01 · Abertura -->
  <div id="s1">
    <div class="abs eyebrow" id="s1e" style="top:366px">UM GUIA PARA INICIANTES</div>
    <div class="abs s1line serif" id="s1l0" style="top:420px">Como editar</div>
    <div class="abs s1line serif" id="s1l1" style="top:562px">vídeos com</div>
    <div class="abs s1line serif it" id="s1l2" style="top:706px">Claude</div>
    <div class="abs" id="s1t" style="left:116px;top:908px;width:768px;height:42px">
      <div class="clip" id="c0" style="left:0"></div>
      <div class="clip" id="c1" style="left:194px"></div>
      <div class="clip" id="c2" style="left:388px"></div>
      <div class="clip" id="c3" style="left:582px"></div>
      <div id="playhead"></div>
    </div>
  </div>

  <!-- 02 · Sete passos -->
  <div id="s2">
    <div class="abs serif" id="s2a" style="top:300px">Comece por</div>
    <div class="abs serif" id="s2n" style="top:452px">7</div>
    <div class="abs" id="s2p" style="top:840px">passos</div>
  </div>

  <!-- Cabeçalho dos passos (03–09) -->
  <div class="abs" id="prog" style="left:170px;top:312px;width:660px;height:4px"></div>
  <div class="abs slabel" id="h1l" style="left:170px;top:340px">Passo 1</div>
  <div class="abs stitle serif" id="h1t" style="left:168px;top:368px">Abra o <span class="it">Claude</span></div>
  <div class="abs slabel" id="h2l" style="left:170px;top:340px">Passo 2</div>
  <div class="abs stitle serif" id="h2t" style="left:168px;top:368px">Defina o <span class="it">estilo</span></div>

  <!-- 03 · Passo 1 -->
  <div class="abs chat" id="chat" style="left:220px;top:560px">
    <div class="bar">
      <div class="dot" id="d0" style="left:18px;background:#FF5F57"></div>
      <div class="dot" id="d1" style="left:38px;background:#FEBC2E"></div>
      <div class="dot" id="d2" style="left:58px;background:#28C840"></div>
      <div class="name">Claude</div>
    </div>
    <div class="hello" id="hello">O que vamos criar hoje?</div>
    <div class="input" id="input">
      <div class="ph">Escreva sua mensagem…</div>
      <div class="send"><svg width="34" height="34" viewBox="0 0 34 34"><path d="M17 23V11M12 16l5-5 5 5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </div>
  </div>
  <div class="abs note" id="note" style="left:220px;top:983px">Ferramentas de vídeo configuradas</div>

  <!-- 04 · Passo 2 -->
  <div class="abs guide" id="guide" style="left:300px;top:530px">
    <div class="head"><span>GUIA VISUAL</span></div>
  </div>
  <div id="items"></div>
  <div id="refs"></div>

  <div class="abs" id="cap"></div>
  <img class="abs" id="logo" src="assets/logo-jackdsgn-horizontal-claro.svg" alt="">
</div>

<script>
// ---------- tempo e easing ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const X = s => ((ax * s + bx) * s + cx) * s, Y = s => ((ay * s + by) * s + cy) * s;
  const dX = s => (3 * ax * s + 2 * bx) * s + cx;
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let s = x;
    for (let i = 0; i < 8; i++) { const d = dX(s); if (Math.abs(d) < 1e-6) break; s -= (X(s) - x) / d; }
    let lo = 0, hi = 1;
    for (let i = 0; i < 20 && Math.abs(X(s) - x) > 1e-6; i++) { X(s) > x ? hi = s : lo = s; s = (lo + hi) / 2; }
    return Y(s);
  };
}
const OUT = bezier(0.22, 1, 0.36, 1);      // entradas (briefing)
const INOUT = bezier(0.65, 0, 0.35, 1);    // saídas e deslocamentos
const prog = (t, a, b) => clamp((t - a) / (b - a));
const back = (p, s = 1.5) => 1 + (s + 1) * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2);   // acomodação curta

// entrada: alpha 0→1, deslocamento dy→0, escala s0→1
const enter = (t, a, d = 0.4) => OUT(prog(t, a, a + d));
const leave = (t, a, d = 0.2) => 1 - INOUT(prog(t, a, a + d));

const $ = id => document.getElementById(id);
function put(el, { o = 1, x = 0, y = 0, s = 1, r = 0, sx = null } = {}) {
  el.style.opacity = o.toFixed(4);
  el.style.visibility = o <= 0.001 ? 'hidden' : 'visible';
  const sc = sx === null ? `scale(${s.toFixed(4)})` : `scale(${sx.toFixed(4)},${s.toFixed(4)})`;
  el.style.transform = `translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${r.toFixed(3)}deg) ${sc}`;
}
// elemento com entrada (alpha + dy + escala) e saída (alpha)
function show(el, t, a, d, out, { dy = 24, s0 = 1, dx = 0, r0 = 0, r = 0, outD = 0.2 } = {}) {
  const p = enter(t, a, d), q = out == null ? 1 : leave(t, out, outD);
  put(el, { o: p * q, x: (1 - p) * dx, y: (1 - p) * dy, s: lerp(s0, 1, p), r: lerp(r0, r, p) });
}

// ---------- construção ----------
// progresso de 7 segmentos
const SEGS = [];
for (let i = 0; i < 7; i++) {
  const w = (660 - 6 * 8) / 7, d = document.createElement('div');
  d.className = 'seg'; d.style.left = (i * (w + 8)) + 'px'; d.style.width = w + 'px';
  d.innerHTML = '<i></i>'; $('prog').appendChild(d); SEGS.push(d.firstChild);
}

// guia visual
const ITEMS = ['Paleta', 'Tipografia', 'Ritmo', 'Legendas', 'Áudio'].map((txt, i) => {
  const d = document.createElement('div');
  d.className = 'abs item'; d.style.left = '325px'; d.style.top = (637 + 59 * i) + 'px';
  d.innerHTML = `<div class="ck"><svg width="18" height="16" viewBox="0 0 18 16"><path d="M2 8.5l4.6 4.5L16 3" fill="none" stroke="#8F8A80" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg></div><span>${txt}</span>`;
  $('items').appendChild(d); return d;
});

// referências de estilo (ilustrações autorais em vetor)
const ART = [
  `<rect width="156" height="156" fill="#F3EBE3"/><path d="M0 156V92c22 0 38 16 38 40v24z" fill="#E8DCCF"/><path d="M16 74a56 56 0 0 1 112 0z" fill="#D77A5C"/><rect x="0" y="74" width="62" height="82" fill="#ECE1D6"/><path d="M92 156c0-46 24-74 60-74" fill="none" stroke="#24231F" stroke-width="2"/>`,
  `<rect width="156" height="156" fill="#F3EBE3"/><circle cx="52" cy="40" r="18" fill="#D77A5C"/><path d="M26 156V112a34 34 0 0 1 68 0v44z" fill="#E6D9CC"/><path d="M78 156l14-82a22 22 0 0 1 44 6l-12 76z" fill="#24231F"/><path d="M18 140L32 52" stroke="#D77A5C" stroke-width="2.4"/>`,
  `<rect width="156" height="156" fill="#F3EBE3"/><path d="M96 0h60v84c-30 6-56-10-60-38z" fill="#E6D9CC"/><path d="M0 70c30-4 56 12 66 44 6 22 18 36 34 42H0z" fill="#D77A5C"/><path d="M4 34c40 2 52 34 70 68 14 26 36 40 70 44" fill="none" stroke="#24231F" stroke-width="2"/>`,
];
const REFS = [
  { x: 548, y: 466, r: 8 },
  { x: 556, y: 628, r: 12 },
  { x: 540, y: 792, r: 9 },
].map((p, i) => {
  const d = document.createElement('div');
  d.className = 'abs ref'; d.style.left = p.x + 'px'; d.style.top = p.y + 'px';
  d.innerHTML = `<b>Estilo ${i + 1}</b><svg width="156" height="156" viewBox="0 0 156 156">${ART[i]}</svg>`;
  $('refs').appendChild(d); return { el: d, ...p };
});

// legendas (janelas estimadas: ainda sem locução gravada)
const CAPS = [
  { a: 0.15, b: 1.85, w0: 0.20, w1: 1.60, txt: 'Quer editar vídeos com Claude?' },
  { a: 2.05, b: 3.85, w0: 2.10, w1: 3.40, txt: 'Comece por estes sete passos.' },
  { a: 4.05, b: 5.85, w0: 4.10, w1: 5.10, txt: 'Um: abra o Claude.' },
  { a: 6.05, b: 7.35, w0: 6.10, w1: 7.00, txt: 'Dois: defina o estilo.' },
  { a: 7.45, b: 9.80, w0: 7.50, w1: 8.80, txt: 'Guia visual e referências.' },
].map(c => {
  const d = document.createElement('div');
  const words = c.txt.split(' ');
  d.innerHTML = words.map(w => `<em>${w}</em>`).join(' ');
  $('cap').appendChild(d);
  return { ...c, el: d, words: [...d.querySelectorAll('em')] };
});

// ---------- timeline ----------
function seek(t) {
  // 01 · Abertura (0–2 s): título por linhas, playhead cruza a timeline, dissolve
  const s1out = 1.80;
  show($('s1e'), t, 0.00, 0.40, s1out, { dy: 16 });
  ['s1l0', 's1l1', 's1l2'].forEach((id, i) => show($(id), t, 0.04 + 0.06 * i, 0.45, s1out, { dy: 26 }));
  ['c0', 'c1', 'c2', 'c3'].forEach((id, i) => show($(id), t, 0.16 + 0.06 * i, 0.38, s1out, { dy: 0, s0: 0.96 }));
  const ph = $('playhead');
  ph.style.left = lerp(4, 764, INOUT(prog(t, 0.30, 1.60))) + 'px';
  put(ph, { o: enter(t, 0.26, 0.2) * leave(t, s1out) });

  // 02 · Sete passos (2–4 s)
  const s2out = 3.80;
  show($('s2a'), t, 1.96, 0.39, s2out, { dy: 22 });
  {
    const p = prog(t, 2.55, 3.10), o = OUT(clamp(p * 1.8)) * leave(t, s2out);
    put($('s2n'), { o, s: lerp(0.86, 1, back(p)), y: (1 - OUT(p)) * 18 });
  }
  show($('s2p'), t, 2.92, 0.38, s2out, { dy: 18 });

  // Cabeçalho: progresso entra no passo 1 e persiste; título troca mantendo a âncora
  put($('prog'), { o: enter(t, 3.96, 0.34) });
  SEGS.forEach((seg, i) => {
    const a = [4.04, 6.02][i];
    seg.style.transform = `scaleX(${a === undefined ? 0 : OUT(prog(t, a, a + 0.32)).toFixed(4)})`;
  });
  show($('h1l'), t, 3.96, 0.39, 5.80, { dy: 16, outD: 0.18 });
  show($('h1t'), t, 4.05, 0.40, 5.80, { dy: 20, outD: 0.18 });
  show($('h2l'), t, 6.00, 0.35, 9.78, { dy: 16 });
  show($('h2t'), t, 6.05, 0.40, 9.78, { dy: 20 });

  // 03 · Passo 1 (4–6 s): card do chat entra; pontos e saudação surgem
  show($('chat'), t, 4.25, 0.50, 5.78, { dy: 24, s0: 0.96 });
  ['d0', 'd1', 'd2'].forEach((id, i) => show($(id), t, 4.85 + 0.08 * i, 0.30, null, { dy: 0, s0: 0.6 }));
  show($('hello'), t, 4.95, 0.45, null, { dy: 16 });
  show($('input'), t, 5.10, 0.40, null, { dy: 12 });
  show($('note'), t, 5.20, 0.35, 5.78, { dy: 10 });

  // 04 · Passo 2 (6–10 s): guia, itens em cascata, referências da direita
  show($('guide'), t, 6.25, 0.55, 9.75, { dy: 24, s0: 0.96 });
  ITEMS.forEach((it, i) => {
    const a = 6.80 + 0.12 * i;
    show(it, t, a, 0.38, 9.75, { dy: 14 });
    it.querySelector('path').style.strokeDashoffset = (1 - OUT(prog(t, a + 0.12, a + 0.42))).toFixed(4);
  });
  REFS.forEach((rf, i) => {
    const a = 8.00 + 0.15 * i;
    show(rf.el, t, a, 0.55, 9.75, { dy: 0, dx: 120, r0: rf.r + 8, r: rf.r, s0: 0.96 });
  });

  // legendas: entrada curta, palavra ativa em terracota
  CAPS.forEach(c => {
    const o = enter(t, c.a, 0.18) * leave(t, c.b - 0.15, 0.15);
    put(c.el, { o, y: (1 - enter(t, c.a, 0.18)) * 8 });
    const n = c.words.length, k = Math.floor(prog(t, c.w0, c.w1) * n - 1e-9);
    c.words.forEach((w, i) => { w.style.color = (i === k && t < c.w1 + 0.25) ? 'var(--accent)' : 'var(--ink)'; });
  });
}

window.seek = seek;
window.ready = document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.decode()))).then(() => { seek(0); return true; });

const q = new URLSearchParams(location.search);
if (q.has('t')) window.ready.then(() => seek(+q.get('t')));
if (q.has('play')) window.ready.then(() => { const t0 = performance.now(); const f = () => { seek(((performance.now() - t0) / 1000) % 10); requestAnimationFrame(f); }; f(); });
</script>
</body>
</html>
